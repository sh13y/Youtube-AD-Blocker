<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Ad Blocker</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="popup-container">
        <!-- Ambient glow -->
        <div class="ambient-glow"></div>

        <!-- Header -->
        <header class="header">
            <div class="brand">
                <div class="logo-wrap">
                    <img src="assets/icon-48.png" alt="Logo" class="logo-icon">
                    <div class="logo-pulse"></div>
                </div>
                <div class="brand-text">
                    <h1>Ad Blocker</h1>
                    <span class="version-badge">v2.0</span>
                </div>
            </div>
            <label class="toggle" id="toggleLabel">
                <input type="checkbox" id="toggleButton" checked>
                <span class="toggle-track">
                    <span class="toggle-thumb"></span>
                </span>
            </label>
        </header>

        <!-- Shield Status -->
        <div class="shield-section" id="shieldSection">
            <div class="shield-ring">
                <svg class="shield-svg" viewBox="0 0 120 120">
                    <circle class="shield-bg" cx="60" cy="60" r="52" />
                    <circle class="shield-progress" cx="60" cy="60" r="52" />
                </svg>
                <div class="shield-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="36" height="36">
                        <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm-1 14.5l-3.5-3.5 1.41-1.41L11 13.67l5.09-5.09L17.5 10 11 16.5z"/>
                    </svg>
                </div>
            </div>
            <div class="shield-label" id="shieldLabel">Protection Active</div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card" id="statAds">
                <div class="stat-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-2h2v2h-2zm0-4V7h2v6h-2z"/>
                    </svg>
                </div>
                <div class="stat-value" id="adsBlocked">0</div>
                <div class="stat-label">Ads Blocked</div>
            </div>
            <div class="stat-card" id="statTime">
                <div class="stat-icon stat-icon--time">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                        <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/>
                    </svg>
                </div>
                <div class="stat-value" id="timeSaved">0</div>
                <div class="stat-label">Min Saved</div>
            </div>
            <div class="stat-card" id="statNetwork">
                <div class="stat-icon stat-icon--network">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                </div>
                <div class="stat-value" id="networkBlocked">0</div>
                <div class="stat-label">Net Blocked</div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="actions">
            <a href="https://github.com/sh13y/youtube-ad-blocker" target="_blank" class="btn btn--github" id="btnGithub">
                <img src="assets/github.svg" alt="GitHub" width="18" height="18">
                <span>Star on GitHub</span>
            </a>
            <a href="https://www.buymeacoffee.com/sh13y" target="_blank" class="btn btn--coffee" id="btnCoffee">
                <span>☕</span>
                <span>Buy me a coffee</span>
            </a>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <span>Made with ❤️ by sh13y</span>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>
</html>
